services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.free
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RL_MONGODB_URI: ${RL_MONGODB_URI:?Set RL_MONGODB_URI in the root .env file}
      RL_MONGODB_DB: ${RL_MONGODB_DB:-researchlens}
      RL_SEARCH_BACKEND: atlas
      RL_EMBEDDING_BACKEND: hashing
      RL_LOG_LEVEL: ${RL_LOG_LEVEL:-INFO}
      RL_LIVE_SEARCH_ENABLED: ${RL_LIVE_SEARCH_ENABLED:-true}

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:8080"